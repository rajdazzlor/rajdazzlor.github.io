<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:#0b1220;color:#fff;padding:20px 12px;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:800;padding:8px 10px 20px}.brand span{color:#60a5fa}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#172033;color:#fff}.main{margin-left:245px;padding:24px;width:calc(100% - 245px);max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{margin:0;font-size:27px}h2{margin:0 0 12px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px;box-shadow:0 2px 8px #1018280a}.num{font-size:27px;font-weight:800;margin-top:7px}.bar{height:9px;background:#e9eef5;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#2563eb;border-radius:99px}.section{margin-top:16px}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.subject{border:1px solid #e5e7eb;border-radius:12px;padding:13px}.task{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f2f5}.task:last-child{border:0}input[type=checkbox]{width:20px;height:20px;accent-color:#2563eb}.btn{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:#fff;font-weight:700}.secondary{background:#eef2f7;color:#344054}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}.text,textarea,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}tex }, "2026-09-27": {"type": "mock"}, "2026-09-28": {"type": "study", "physics": "Current Electricity", "chemistry": "Alcohols, Phenols & Ethers", "maths": "Continuity & Differentiability"}, "2026-09-29": {"type": "study", "physics": "Moving Charges & Magnetism", "chemistry": "Aldehydes & Ketones", "maths": "Continuity & Differentiability"}, "2026-09-30": {"type": "study", "physics": "Moving Charges & Magnetism", "chemistry": "Aldehydes & Ketones", "maths": "Application of Derivatives"}, "2026-10-01": {"type": "study", "physics": "Magnetism", "chemistry": "Carboxylic Acids", "maths": "Application of Derivatives"}, "2026-10-02": {"type": "study", "physics": "Magnetism", "chemistry": "Carboxylic Acids", "maths": "Indefinite Integration"}, "2026-10-03": {"type": "revision"}, "2026-10-04": {"type": "mock"}, "2026-10-05": {"type": "study", "physics": "EMI", "chemistry": "Amines", "maths": "Indefinite Integration"}, "2026-10-06": {"type": "study", "physics": "AC", "chemistry": "Biomolecules + Polymers", "maths": "Definite Integration"}, "2026-10-07": {"type": "study", "physics": "AC", "chemistry": "Biomolecules + Polymers", "maths": "Definite Integration"}, "2026-10-08": {"type": "study", "physics": "EM Waves", "chemistry": "Coordination Compounds", "maths": "Area Under Curve"}, "2026-10-09": {"type": "study", "physics": "EM Waves", "chemistry": "Coordination Compounds", "maths": "Area Under Curve"}, "2026-10-10": {"type": "revision"}, "2026-10-11": {"type": "mock"}, "2026-10-12": {"type": "study", "physics": "Ray Optics", "chemistry": "d- & f-Block", "maths": "Differential Equations"}, "2026-10-13": {"type": "study", "physics": "Ray Optics", "chemistry": "d- & f-Block", "maths": "Differential Equations"}, "2026-10-14": {"type": "study", "physics": "Wave Optics", "chemistry": "p-Block", "maths": "Vector Algebra"}, "2026-10-15": {"type": "study", "physics": "Wave Optics", "chemistry": "p-Block", "maths": "Vector Algebra"}, "2026-10-16": {"type": "study", "physics": "Dual Nature + Atoms + Nuclei", "chemistry": "Metallurgy + Practical Chemistry", "maths": "3D Geometry"}, "2026-10-17": {"type": "revision"}, "2026-10-18": {"type": "mock"}, "2026-10-19": {"type": "study", "physics": "Dual Nature + Atoms + Nuclei", "chemistry": "Metallurgy + Practical Chemistry", "maths": "3D Geometry"}, "2026-10-20": {"type": "study", "physics": "Semiconductors + Experimental Physics", "chemistry": "Revision", "maths": "Mathematical Reasoning + Revision"}};
const KEY="jee_cc_v1";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{done:{},mocks:[],errors:{},notes:{}};let page="dashboard";
const labels={dashboard:"Dashboard",today:"Today's Plan",calendar:"Daily Plan",chapters:"Chapters",mocks:"Mocks",errors:"Error Log"};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const key=(d,t)=>d+"|"+t;
const days=()=>Object.keys(PLAN);
const study=()=>days().filter(d=>PLAN[d].type==="study");
const dayPct=d=>{let x=PLAN[d], n=x.type==="study"?5*3:6;let keys=x.type==="study"?["p1","p2","p3","p4","p5","c1","c2","c3","c4","c5","m1","m2","m3","m4","m5"]:Object.keys({a:1,b:1,c:1,d:1,e:1,f:1});return Math.round(keys.filter(k=>S.done[key(d,k)]).length/n*100)};
const overall=()=>{let a=[];study().forEach(d=>{for(let i=1;i<=15;i++)a.push(S.done[key(d,["p1","p2","p3","p4","p5","c1","c2","c3","c4","c5","m1","m2","m3","m4","m5"][i-1])]||false)});return Math.round(a.filter(Boolean).length/a.length*100)};
function nav(){let a=["dashboard","today","calendar","chapters","mocks","errors"];document.getElementById("nav").innerHTML=a.map(x=>`<button class="${page===x?"active":""}" onclick="go('${x}')">${labels[x]}</button>`).join("");document.getElementById("mobile").innerHTML=a.slice(0,5).map(x=>`<button onclick="go('${x}')">${labels[x]}</button>`).join("")}
function go(p){page=p;render()}
function check(d,t,label){let v=!!S.done[key(d,t)];return `<label class="task"><input type="checkbox" ${v?"checked":""} onchange="S.done['${key(d,t)}']=this.checked;save();render()"> ${label}</label>`}
function dashboard(){let dl=Math.max(0,Math.ceil((new Date("2026-10-20")-new Date())/86400000));return `<div class="grid"><div class="card"><div class="muted">Overall</div><div class="num">${overall()}%</div><div class="bar"><div class="fill" style="width:${overall()}%"></div></div></div><div class="card"><div class="muted">Days left</div><div class="num">${dl}</div><div class="muted">Deadline: 20 Oct</div></div><div class="card"><div class="muted">Completed days</div><div class="num">${study().filter(d=>dayPct(d)===100).length}</div></div><div class="card"><div class="muted">Mocks logged</div><div class="num">${S.mocks.length}</div></div></div><div class="card section"><h2>Today</h2><button class="btn" onclick="go('today')">Open today's checklist</button></div>`}
function today(){let d=new Date().toISOString().slice(0,10);if(!PLAN[d])d=days().find(x=>x>=d)||days()[days().length-1];return datePage(d)}
function datePage(d){let x=PLAN[d];if(x.type==="study")return `<div class="card"><span class="pill">${d}</span><h2 style="margin-top:8px">3-Subject Daily Checklist</h2><div class="subjects"><div class="subject"><h3>Physics</h3><p>${x.physics}</p>${["Lecture","Notes","Questions","Revision","PYQs / Test"].map((z,i)=>check(d,"p"+(i+1),z)).join("")}</div><div class="subject"><h3>Chemistry</h3><p>${x.chemistry}</p>${["Lecture","Notes","Questions","Revision","PYQs / Test"].map((z,i)=>check(d,"c"+(i+1),z)).join("")}</div><div class="subject"><h3>Mathematics</h3><p>${x.maths}</p>${["Lecture","Notes","Questions","Revision","PYQs / Test"].map((z,i)=>check(d,"m"+(i+1),z)).join("")}</div></div><p class="muted">Day progress: ${dayPct(d)}%</p></div>`;let labs=x.type==="revision"?["Physics revision","Chemistry revision","Maths revision","Chapter tests","Backlog","Error log"]:["JEE mock","Mock analysis","Weak chapters","Weak-topic revision","Backlog","Next-week plan"];return `<div class="card"><span class="pill">${d}</span><h2>${x.type==="revision"?"Saturday Revision":"Sunday Mock + Analysis"}</h2>${labs.map((l,i)=>check(d,String.fromCharCode(97+i),l)).join("")}<textarea placeholder="Notes / observations" oninput="S.notes['${d}']=this.value;save()">${S.notes[d]||""}</textarea></div>`}
function calendar(){return `<div class="card"><table><tr><th>Date</th><th>Type</th><th>Physics</th><th>Chemistry</th><th>Maths</th><th>%</th></tr>${days().map(d=>{let x=PLAN[d];return `<tr><td>${d}</td><td>${x.type}</td><td>${x.physics||"—"}</td><td>${x.chemistry||"—"}</td><td>${x.maths||"—"}</td><td>${dayPct(d)}%</td></tr>`}).join("")}</table></div>`}
function chapters(){let all=[["Physics","physics"],["Chemistry","chemistry"],["Maths","maths"]];return all.map(([n,k])=>{let m={};study().forEach(d=>{let ch=PLAN[d][k];(m[ch]??=[]).push(d)});return `<div class="card section"><h2>${n}</h2><table><tr><th>Chapter</th><th>Planned days</th></tr>${Object.entries(m).map(([ch,ds])=>`<tr><td>${ch}</td><td>${ds.join(", ")}</td></tr>`).join("")}</table></div>`}).join("")}
function mocks(){return `<div class="card"><h2>Add Mock</h2><div class="grid"><input class="text" id="md" type="date"><input class="text" id="ms" placeholder="Score"><input class="text" id="mp" placeholder="Physics"><input class="text" id="mc" placeholder="Chemistry"></div><div style="margin-top:10px" class="grid"><input class="text" id="mm" placeholder="Maths"><input class="text" id="mw" placeholder="Weakest area"><button class="btn" onclick="addMock()">Save</button></div></div><div class="card section"><table><tr><th>Date</th><th>Score</th><th>P</th><th>C</th><th>M</th><th>Weakness</th></tr>${S.mocks.map(m=>`<tr><td>${m.d}</td><td>${m.s}</td><td>${m.p}</td><td>${m.c}</td><td>${m.m}</td><td>${m.w}</td></tr>`).join("")}</table></div>`}
function addMock(){S.mocks.push({d:md.value,s:ms.value,p:mp.value,c:mc.value,m:mm.value,w:mw.value});save();render()}
function errors(){return `<div class="card"><h2>Error Log</h2><input class="text" id="et" placeholder="Subject + chapter + question + why wrong + fix"><button class="btn" style="margin-top:10px" onclick="addErr()">Save error</button><div class="section">${Object.values(S.errors).map(x=>`<p>${x}</p>`).join("")}</div></div>`}
function addErr(){S.errors[Date.now()]=et.value;save();render()}
function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="jee-command-center-backup.json";a.click()}
function render(){nav();document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});document.getElementById("title").textContent=labels[page];document.getElementById("content").innerHTML=page==="dashboard"?dashboard():page==="today"?today():page==="calendar"?calendar():page==="chapters"?chapters():page==="mocks"?mocks():errors()}
